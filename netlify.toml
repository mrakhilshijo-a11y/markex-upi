[build]
  command = "npm install && node scripts/stage-netlify-assets.mjs"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "production"
  GIT_LFS_SKIP_SMUDGE = "1"
  # Public branding and site URLs are not credentials. Netlify otherwise
  # fails the build when those env values also appear in source.
  SECRETS_SCAN_OMIT_KEYS = "BASE_ADMIN_URL,BASE_CHECKOUT_URL,BASE_DEMO_STORE_URL,BASE_PAYMENT_API_URL,CHECKOUT_FRAME_ANCESTORS,CHECKOUT_GUEST_MODE,CHECKOUT_PUBLIC_URL,COIN_STORE_PUBLIC_URL,DEFAULT_APP_NAME,DEFAULT_FOOTER_GUARANTEE,DEFAULT_HIDE_POWERED_BY,DEFAULT_MERCHANT_NAME,DEFAULT_MERCHANT_SLUG,DEFAULT_PRIMARY_COLOR,DEFAULT_SUPPORT_EMAIL,DEFAULT_SUPPORT_PHONE,DEFAULT_TRUST_BADGE_TEXT,MARKEX_SHOW_BANK_TRANSFER,MERCHANT_BANK_NAME,MERCHANT_NAME,NEON_BRANCH,NEON_BRANCH_ID,NODE_ENV,NODE_VERSION,PAYMENT_ACTIVE_WINDOW_MS,PAYMENT_LINK_DEFAULT_EXPIRY_HOURS,PAYMENT_PROCESSING_WINDOW_MS,PAYMENT_PROVIDER,PAYMENT_VERIFICATION_MODE,WEBHOOK_INITIAL_BACKOFF_MS,WEBHOOK_MAX_RETRIES,WEBHOOK_RETRY_INTERVAL_MS,YOUPI_ALLOWED_ORIGINS,YOUPI_ALLOWED_RETURN_ORIGINS,YOUPI_MODE,LATE_OBSERVATION_WINDOW_MS,GIT_LFS_SKIP_SMUDGE"

[server]
  region = "cmh"
  size = "small"
